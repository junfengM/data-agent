default_model: deepseek-v4-flash

models:
  deepseek-v4-flash:
    provider: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-flash
    temperature: 0.2
    max_tokens: null

  deepseek-v4-pro:
    provider: deepseek
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    model: deepseek-v4-pro
    temperature: 0.2
    max_tokens: null

  openai-gpt-4.1:
    provider: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    model: gpt-4.1
    temperature: 0.2
    max_tokens: null
