[project]
name = "data-agent-server"
version = "0.1.0"
description = "Local-first data analysis agent harness backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
  "httpx[socks]>=0.27.0",
  "openai>=1.35.0",
  "pandas>=2.2.0",
  "duckdb>=1.0.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.2.0",
  "nbformat>=5.10.0",
  "plotly>=5.22.0",
  "markdown-it-py[linkify]>=3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
