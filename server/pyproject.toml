[project]
name = "data-agent-server"
version = "0.1.0"
description = "Local-first data analysis agent harness backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0.1",
  "httpx[socks]>=0.27.0",
  "openai>=1.35.0",
  "pandas>=2.2.0",
  "duckdb>=1.0.0",
  "openpyxl>=3.1.0",
  "xlsxwriter>=3.2.0",
  "nbformat>=5.10.0",
  "plotly>=5.22.0",
  "markdown-it-py[linkify]>=3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]

[build-system]
requires = ["setuptools>=70.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false
disable_error_code = ["import-untyped"]

# Legacy dynamic modules are exempt from strict type checking while the
# codebase migrates incrementally; every other module is checked. Shrink this
# list over time instead of growing it.
[[tool.mypy.overrides]]
module = [
  "app.agent.artifact_manifest",
  "app.agent.artifact_manifest_blocks",
  "app.agent.orchestrator",
  "app.agent.planner",
  "app.agent.quarto_renderer",
  "app.agent.quarto_runtime",
  "app.agent.run_artifacts",
  "app.agent.run_validation",
  "app.agent.semantic_finding_service",
  "app.agent.visual_deck_blocks",
  "app.agent.visual_deck_evidence",
  "app.agent.visual_report_assembly",
  "app.api.model_routes",
  "app.api.run_routes",
  "app.api.trace_routes",
  "app.core.llm",
  "app.memory.store",
  "app.tools.execution",
  "app.tools.preflight",
  "app.tools.report_evidence",
  "app.tools.semantic_inference",
  "app.tools.semantic_validation",
  "app.tools.validation",
]
ignore_errors = true
